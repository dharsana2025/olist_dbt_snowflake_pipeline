version: 2

sources:
  - name: raw
    database: OLIST_DB
    schema: RAW
    description: "Raw Olist Brazilian E-Commerce data loaded from CSV files"

    tables:
      - name: orders
        description: "Main orders table — one row per order"
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          - name: customer_id
            tests:
              - not_null
          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values: ['delivered','shipped','canceled',
                           'invoiced','processing','approved',
                           'unavailable','created']

      - name: customers
        description: "Customer details with city and state"
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
          - name: customer_unique_id
            tests:
              - not_null

      - name: order_items
        description: "Line items — one row per product per order"
        columns:
          - name: order_id
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: price
            tests:
              - not_null

      - name: payments
        description: "Payment details — one order can have multiple payment rows"
        columns:
          - name: order_id
            tests:
              - not_null
          - name: payment_type
            tests:
              - not_null
              - accepted_values:
                  values: ['credit_card','boleto','voucher',
                           'debit_card','not_defined']
          - name: payment_value
            tests:
              - not_null

      - name: reviews
        description: "Customer review scores and comments"
        columns:
          - name: review_id
            tests:
              - not_null
          - name: order_id
            tests:
              - not_null
          - name: review_score
            tests:
              - not_null
              - accepted_values:
                  config: 
                    where: "review_score is not null"
                  values: [1, 2, 3, 4, 5]

      - name: product
        description: "Product catalog with dimensions and category"
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

      - name: product_category
        description: "Maps Portuguese category names to English"
        columns:
          - name: product_category_name
            tests:
              - unique
              - not_null